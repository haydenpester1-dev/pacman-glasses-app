<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Pac-Man arcade game for Meta Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<title>Pac-Man</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-block"><div class="hud-label">SCORE</div><div class="hud-value" id="score">0</div></div>
    <div class="hud-block"><div class="hud-label">HI-SCORE</div><div class="hud-value" id="hiscore">0</div></div>
    <div class="hud-block"><div class="hud-label">LEVEL</div><div class="hud-value" id="level">1</div></div>
    <div class="hud-block"><div class="hud-label">LIVES</div><div id="lives"></div></div>
  </header>
  <div id="stage">
    <canvas id="game" width="600" height="560"></canvas>
    <div id="overlay">
      <div id="overlay-title">PAC-MAN</div>
      <div id="overlay-sub">Press Enter to start</div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
